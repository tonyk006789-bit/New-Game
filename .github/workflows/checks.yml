name: Arcade checks
on: [push, pull_request]
jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: newgame
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: new_game_dev
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:netlify
      - run: pnpm build
      - run: pnpm build:netlify
      - run: pnpm test:ledger
        env:
          DATABASE_URL: postgres://newgame:local-ci-only@localhost:5432/new_game_dev
          ALLOW_LOCAL_FIXTURES: 'true'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          DATABASE_URL: postgres://newgame:local-ci-only@localhost:5432/new_game_dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
